server:
  port: 8085

spring:
  application:
    name: sales-pipeline-service
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sales_db}
    username: ${DB_USERNAME:salesuser}
    password: ${DB_PASSWORD:salessecret}
    driver-class-name: org.postgresql.Driver
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:mySecretKey}
  expiration: ${JWT_EXPIRATION:86400}

# External Service URLs
services:
  auth:
    url: ${AUTH_SERVICE_URL:http://localhost:8080/api/v1}
  customer:
    url: ${CUSTOMER_SERVICE_URL:http://localhost:8081/api/v1}
  product:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8083/api/v1}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging Configuration
logging:
  level:
    com.simplecrm: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"