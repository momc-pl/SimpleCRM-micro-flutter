name: simple_crm_flutter
description: SimpleCRM Flutter Cross-Platform Application with Micro-Frontend Architecture
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # HTTP & API
  dio: ^5.4.0
  retrofit: ^4.0.3
  json_annotation: ^4.8.1
  
  # Security & Authentication
  flutter_secure_storage: ^9.0.0
  jwt_decode: ^0.3.1
  
  # Navigation
  go_router: ^12.1.3
  
  # UI Components
  material_color_utilities: ^0.8.0
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  
  # Utilities
  get_it: ^7.6.4
  logger: ^2.0.2+1
  intl: ^0.18.1
  equatable: ^2.0.5
  
  # Platform Detection
  flutter_web_plugins:
    sdk: flutter
    
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
  # Code Generation
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  retrofit_generator: ^8.0.4
  riverpod_generator: ^2.3.9
  
  # Testing
  mockito: ^5.4.2
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700